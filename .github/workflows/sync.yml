name: Sync tray assets

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [tray-assets-updated]
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
      - 'package-lock.json'
      - 'package.json'
      - 'README.md'
      - 'scripts/read-author-info.mjs'
      - 'scripts/catalog-metadata.mjs'
      - 'scripts/checkout-catalog-repos.mjs'
      - 'scripts/checkout-image-repos.mjs'
      - 'scripts/deployment-catalog.mjs'
      - 'scripts/repository-discovery.mjs'
      - 'scripts/stage-assets.mjs'
      - 'scripts/verify-deployment.mjs'

permissions:
  contents: write

concurrency:
  group: tray-hub-asset-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: tray-hub
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tray-hub/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: tray-hub
      - name: Discover image repositories
        run: node scripts/checkout-image-repos.mjs
        working-directory: tray-hub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAY_ASSET_ROOT: ${{ github.workspace }}
      - name: Stage and validate assets
        run: npm run stage
        working-directory: tray-hub
        env:
          TRAY_ASSET_ROOT: ${{ github.workspace }}
          TRAY_SKIP_ASSET_BUILD: '1'
      - name: Test Worker
        run: npm test
        working-directory: tray-hub
      - name: Compare public deployment with the discovered catalog
        id: deployment
        continue-on-error: true
        run: npm run verify:deployment
        working-directory: tray-hub
        env:
          TRAY_HUB_URL: https://tray.cati.me
          TRAY_VERIFY_ATTEMPTS: '2'
      - name: Commit updated asset catalog
        working-directory: tray-hub
        shell: bash
        env:
          DEPLOYMENT_STATUS: ${{ steps.deployment.outcome }}
        run: |
          git add data/collections.json data/assets-lock.json
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "chore: sync tray assets"
            git pull --rebase origin main
            git push origin HEAD:main
          elif [ "$DEPLOYMENT_STATUS" != "success" ]; then
            echo "Asset catalog is current, but the public deployment is stale."
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git pull --rebase origin main
            git commit --allow-empty -m "chore: redeploy tray assets"
            git push origin HEAD:main
          else
            echo "Asset catalog is already current."
          fi
